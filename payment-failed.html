<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Échoué - Barishop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .failed-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
            text-align: center;
            padding: 20px;
        }

        .failed-card {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(239, 68, 68, 0.1);
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .failed-icon {
            width: 80px;
            height: 80px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .failed-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        .failed-card p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-retry {
            display: inline-block;
            background: #ef4444;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            margin-right: 10px;
        }

        .btn-retry:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            display: inline-block;
            background: #f3f4f6;
            color: #374151;
            padding: 1rem 2.5rem;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
    </style>
</head>

<body>
    <div class="failed-page">
        <div class="failed-card">
            <div class="failed-icon">
                <i class="fas fa-times"></i>
            </div>
            <h1>Oups ! Le paiement a échoué.</h1>
            <p>Nous n'avons pas pu traiter votre transaction avec TalyPay. Cela peut être dû à un solde insuffisant ou
                une annulation de votre part.</p>
            <a href="index.html" class="btn-retry">Réessayer</a>
            <a href="index.html#contact" class="btn-secondary">Besoin d'aide ?</a>
        </div>
    </div>
</body>

</html>
